services:
  api:
    build: ./backend
    env_file: .env
    environment:
      FRONTEND_ORIGIN: \${FRONTEND_ORIGIN:-http://localhost:8080}
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    restart: unless-stopped
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "\${WEB_BIND_ADDRESS:-127.0.0.1}:\${WEB_PORT:-8080}:80"
    restart: unless-stopped
