services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emailassistant
      POSTGRES_USER: emailassistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - emailassistant_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailassistant -d emailassistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://emailassistant:${POSTGRES_PASSWORD:-change-me}@db:5432/emailassistant
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://emailassistant:${POSTGRES_PASSWORD:-change-me}@db:5432/emailassistant
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped
volumes:
  emailassistant_db:
