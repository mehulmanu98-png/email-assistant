name: Scheduled mailbox sync

on:
  schedule:
    # Poll the durable Neon queue every five minutes. GitHub may delay scheduled runs.
    # The worker checks the user's 08:00, 12:00 and 17:00 Asia/Kolkata sync slots.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mail-sync.yml"
      - "backend/**"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FIELD_ENCRYPTION_KEY: ${{ secrets.EMAIL_ASSISTANT_FIELD_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.EMAIL_ASSISTANT_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.EMAIL_ASSISTANT_GOOGLE_CLIENT_SECRET }}
      TIMEZONE: Asia/Kolkata
      AUTO_SYNC_TIMES: "08:00,12:00,17:00"
      MAX_MESSAGES_PER_SYNC: "500"
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        id: secrets
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" || -z "${FIELD_ENCRYPTION_KEY}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configure NEON_DATABASE_URL and EMAIL_ASSISTANT_FIELD_KEY in repository Actions secrets to enable mailbox processing."
          else
            if { [[ -n "${GOOGLE_CLIENT_ID}" ]] && [[ -z "${GOOGLE_CLIENT_SECRET}" ]]; } || { [[ -z "${GOOGLE_CLIENT_ID}" ]] && [[ -n "${GOOGLE_CLIENT_SECRET}" ]]; }; then
              echo "::error::Both Gmail OAuth secrets must be configured together."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.configured == 'true'
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pip install -r requirements.txt
      - name: Run scheduled slot check and process queued mailbox jobs
        if: steps.secrets.outputs.configured == 'true'
        run: python -m app.worker --scheduled-once
