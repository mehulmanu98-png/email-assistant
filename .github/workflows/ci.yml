name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q app
        working-directory: backend
      - run: PYTHONPATH="$PWD" pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: bash -n scripts/setup-local.sh scripts/deploy-cloud-run.sh scripts/backup-neon.sh scripts/restore-neon.sh
      - run: bash scripts/test-backup-restore.sh
      - run: docker build -t email-assistant-cloud-run .
